<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f0f1b"><link rel="manifest" href="manifest.webmanifest"><title>The Long Quiet</title>
<style>
html,body{margin:0;height:100%;background:#0f0f1b;color:#e8d9b0;font-family:monospace;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
#view{flex:0 0 auto;position:relative;margin:8px auto 0;padding:0!important;display:flex;justify-content:center;align-items:center;padding-top:8px}
#view canvas,#vig{position:absolute;left:0;top:0;border:0!important}#view{outline:2px solid #3a2e3f}#c{background:transparent!important}#g3{position:absolute}#vig{position:absolute;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75) 100%)}#view{min-height:10px}canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;border:2px solid #3a2e3f}
#pad{flex:1;display:flex;justify-content:space-between;align-items:flex-end;padding:12px 18px 22px;min-height:230px;box-sizing:border-box}
.dp{position:relative;width:180px;height:180px}
.b{position:absolute;background:#2b2236;border:3px solid #5a4a6a;color:#e8d9b0;font:bold 16px monospace;display:flex;align-items:center;justify-content:center;border-radius:14px}
.b.on{background:#7a2030}
.dp .b{width:62px;height:62px}
#u{left:59px;top:0}#d{left:59px;bottom:0}#l{left:0;top:59px}#r{right:0;top:59px}
.ab{position:relative;width:170px;height:200px}
#A{width:84px;height:84px;border-radius:50%;right:0;top:40px;font-size:22px}
#B{width:68px;height:68px;border-radius:50%;left:0;top:96px}
#M{width:64px;height:36px;right:8px;top:0;font-size:12px}#Q{width:44px;height:30px;left:58px;top:0;font-size:11px}#I{width:64px;height:36px;left:0;top:30px;font-size:12px}
@media (orientation:landscape) and (max-height:600px){#app{flex-direction:row}#view{order:2;flex:1;padding:4px}#pad{display:contents}.dp{order:1;align-self:center;margin:0 12px}.ab{order:3;align-self:center;margin:0 12px}}
@media (hover:hover) and (pointer:fine) and (min-width:900px){#pad{justify-content:center;gap:60px;opacity:.6}}
</style></head><body><div id="app"><div id="view"><canvas id="g3"></canvas><div id="vig"></div><canvas id="c" width="320" height="568"></canvas></div>

<div class="ab"><div class="b" id="M">START</div><div class="b" id="Q">MED</div><div class="b" id="I">ITEMS</div><div class="b" id="B">B<br>knife</div><div class="b" id="A">A<br>fire</div></div></div></div>
