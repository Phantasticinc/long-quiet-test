<!doctype html><html><head><meta charset="utf-8"><title>The Long Quiet - lineups</title>
<style>body{margin:0;background:#0b0b12;color:#d8d0c0;font:12px monospace}h2{margin:8px 12px;font-size:16px;color:#ffb060}.row{display:flex;flex-wrap:wrap;gap:6px;padding:4px 12px}.c{text-align:center;width:var(--w)}canvas{image-rendering:pixelated;background:radial-gradient(#2a2a3a,#0b0b12)}</style></head><body><div id=x></div><script src="variety.js"></script><script src="art.js"></script>

<script>
const P=new URLSearchParams(location.search).get('p')||'zombies';
function add(row,kind,id,label,sc,frame){const s=ART.sheet(kind,id),c=document.createElement('canvas');c.width=s.fw*sc;c.height=s.fh*sc;const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(s.c,(frame||0)*s.fw,0,s.fw,s.fh,0,0,c.width,c.height);const d=document.createElement('div');d.className='c';d.style.setProperty('--w',c.width+'px');d.append(c,document.createElement('br'),label);row.append(d);}
function sec(t){const h=document.createElement('h2');h.textContent=t;document.body.append(h);const r=document.createElement('div');r.className='row';document.body.append(r);return r;}
if(P=='zombies'){let r=sec('ZOMBIE TYPES');Object.keys(VAR.ZT).forEach((t,i)=>add(r,'zom',t+':house:'+(i*7+3),VAR.NAMES[t],2.2));
 r=sec('CITY SKINS (walker)');['house','civ','market','fisher','nurse','patient','guard','herder','trucker','commuter','worker'].forEach((k,i)=>add(r,'zom','walker:'+k+':'+(i+11),k.toUpperCase(),1.6));
 r=sec('BOSSES & MID-BOSSES');[0,1,2,3,4,5,8,9,10,11,12,7].forEach(i=>add(r,'boss',i,(i==7?'SECRET: THE FIRST QUIET':i>=8?VAR.MID[i-7].name:'CH'+(i+1)+' BOSS'),1.25));}
else{const H=['linh','huong','adaeze','yerlan','jiwoo','tomas','minh'];let r=sec('SURVIVOR COSTUMES - 3 OUTFITS');
 H.forEach((h,i)=>[0,1,2].forEach(o=>add(r,'hero',h+'#'+o+'@0',h.toUpperCase()+' '+VAR.OUTFITS[o],1.5)));
 r=sec('WEAR & TEAR BY CHAPTER (0-3)');H.forEach(h=>[0,1,2,3].forEach(w=>add(r,'hero',h+'#0@'+w,h+' W'+w,1.2)));
 r=sec('NPC SURVIVORS');Object.values(VAR.NPC).flat().forEach(n=>add(r,'hero','npc:'+n.seed+':'+(n.age||'adult'),n.name,1.5));}
</script></body></html>
