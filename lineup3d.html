<!doctype html><html><body style="margin:0;background:#0a0a0c"><script type="module">
import * as THREE from './lib/three.module.min.js';import {makeChar,animChar} from './chars3d.js';
const p=new URLSearchParams(location.search).get('p')||'heroes';
const L={heroes:[['hero','linh'],['hero','huong'],['hero','adaeze'],['hero','yerlan'],['hero','jiwoo'],['hero','tomas'],['hero','minh'],['hero','courier'],['npc','npc:3:kid'],['npc','npc:7:adult'],['npc','npc:11:old']],
 zombies:['walker:house:1','runner:street:2','riot:x:3','bloater:house:4','frozen:x:5','drowned:x:6','spitter:lab:7','screamer:x:8','crawler:house:9'].map(k=>['zom',k]),
 bosses:[0,1,2,3,4,5,7,8,9,10,11,12].map(i=>['boss',i])}[p];
const W=1600,H=560,r=new THREE.WebGLRenderer({antialias:false});r.setSize(W,H);r.setPixelRatio(1);document.body.appendChild(r.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color('#121018');sc.add(new THREE.HemisphereLight('#8090b0','#201810',1.2));const d=new THREE.DirectionalLight('#ffd8b0',2.4);d.position.set(2,4,5);sc.add(d);const rim=new THREE.DirectionalLight('#5070ff',1.5);rim.position.set(-3,2,-4);sc.add(rim);
const fl=new THREE.Mesh(new THREE.PlaneGeometry(40,6),new THREE.MeshLambertMaterial({color:'#2a2622'}));fl.rotation.x=-Math.PI/2;sc.add(fl);
const n=L.length,sp=p=='bosses'?1.25:1.0,cam=new THREE.PerspectiveCamera(30,W/H,.1,100);cam.position.set(0,1.1,n*sp*0.5+.6);cam.lookAt(0,.9,0);
const id=m=>m;let tris=0;const objs=L.map(([k,key],i)=>{const o=makeChar(k,key,k=='boss'?1.7:1.35,id);o.position.x=(i-(n-1)/2)*sp;sc.add(o);tris+=o.userData.tris;return o;});
objs.forEach((o,i)=>animChar(o,{t:1.2+i,face:.15,seed:i},.016));r.render(sc,cam);window.TRIS=objs.map(o=>o.userData.tris);window.DONE=1;
</script></body></html>
